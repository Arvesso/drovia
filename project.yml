name: Drovia
options:
  bundleIdPrefix: com.arvesso
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES

# Exact versions: the resolved file lives in the generated (uncommitted) project, so ranges would let
# every fresh clone and CI run pick up new releases.
packages:
  libwebp:
    url: https://github.com/SDWebImage/libwebp-Xcode
    exactVersion: 1.6.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0

targets:
  Drovia:
    type: application
    platform: macOS
    sources:
      - path: Drovia
    dependencies:
      - package: libwebp
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arvesso.drovia
        PRODUCT_NAME: Drovia
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Drovia reads the files selected in Finder when you open the wheel with the keyboard shortcut."
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: "Drovia works with the files you drop on the wheel from your Desktop."
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: "Drovia works with the files you drop on the wheel from your Documents folder."
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: "Drovia works with the files you drop on the wheel from your Downloads folder."
        INFOPLIST_KEY_NSRemovableVolumesUsageDescription: "Drovia works with the files you drop on the wheel from external drives."
        INFOPLIST_KEY_NSNetworkVolumesUsageDescription: "Drovia works with the files you drop on the wheel from network drives."
        INFOPLIST_KEY_CFBundleDisplayName: Drovia
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Arvesso. MIT License."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Drovia/Drovia.entitlements
      configs:
        # Without the hardened runtime, any process could inject code into Drovia and inherit its folder
        # and Full Disk Access permissions; it's also required for notarization. Debug builds stay without
        # it so the (differently signed) test bundle can load into the app.
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          # Development signing would add get-task-allow, which lets other processes attach and inject code.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        Debug:
          ENABLE_HARDENED_RUNTIME: NO

  DroviaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DroviaTests
    dependencies:
      - target: Drovia
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.arvesso.drovia.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Drovia.app/Contents/MacOS/Drovia"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Drovia:
    build:
      targets:
        Drovia: all
        DroviaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DroviaTests
