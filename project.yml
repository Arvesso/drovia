name: Drovia
options:
  bundleIdPrefix: com.arvesso
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES

packages:
  libwebp:
    url: https://github.com/SDWebImage/libwebp-Xcode
    from: 1.5.0

targets:
  Drovia:
    type: application
    platform: macOS
    sources:
      - path: Drovia
    dependencies:
      - package: libwebp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arvesso.drovia
        PRODUCT_NAME: Drovia
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Drovia
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Arvesso. MIT License."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: NO

  DroviaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DroviaTests
    dependencies:
      - target: Drovia
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.arvesso.drovia.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Drovia.app/Contents/MacOS/Drovia"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Drovia:
    build:
      targets:
        Drovia: all
        DroviaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DroviaTests
