name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # SwiftFormat versions format a few constructs differently, so CI uses a fixed release; .swiftformat's
      # --minversion makes older local copies say so instead of disagreeing.
      - name: Install tools
        env:
          SWIFTFORMAT_VERSION: 0.64.4
        run: |
          brew install xcodegen
          curl -sSfL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip"
          unzip -q -o "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"

      - name: Check formatting
        run: |
          swiftformat --version
          swiftformat --lint .

      - name: Test
        run: make test

      # Release differs from Debug (optimization, dead code stripping, hardened runtime).
      - name: Build Release
        run: make release
